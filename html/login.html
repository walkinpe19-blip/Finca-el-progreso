<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión | Finca El Progreso</title>
    <link rel="stylesheet" href="../css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="auth-page">
    <div class="auth-container">
        <div class="auth-card">
            <h2>Iniciar sesión</h2>
            <p>Accede a tu cuenta para ver reportes y administrar el sistema.</p>
            <form id="form-login">
                <input type="email" id="login-correo" placeholder="Correo electrónico" required>
                <input type="password" id="login-password" placeholder="Contraseña" required>
                <button type="submit">Entrar</button>
            </form>
            <div id="login-message" class="auth-message"></div>
            <p class="auth-link">¿No tienes cuenta? <a href="registro.html">Regístrate aquí</a></p>
        </div>
    </div>
    <script src="../js/script.js"></script>
</body>
</html>
